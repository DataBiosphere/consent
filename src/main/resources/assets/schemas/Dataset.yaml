type: object
properties:
  name:
    type: string
    description: The dataset name
  datasetName:
    type: string
    deprecated: true
    description: Legacy value for backwards compatibility, same as the dataset name
  datasetId:
    type: integer
    format: int32
    description: The dataset id, integer format
  createUserId:
    type: integer
    format: int32
    description: The create user id, if available
  createUser:
    $ref: './User.yaml'
  createDate:
    type: string
    format: date-time
    description: The dataset creation date
  dacId:
    type: integer
    description: The id of the DAC this dataset belongs to, if defined.
  consentId:
    type: string
    deprecated: true
    description: The consent id.
  translatedDataUse:
    type: string
    description: The Data Use in a readable format
  deletable:
    type: boolean
    description: Describes if this DataSet can be deleted (This information is only given to the Admin).
  properties:
    type: array
    items:
      $ref: './DatasetProperty.yaml'
    example:
      - propertyName: Data Type
        propertyValue: Whole Genome
      - propertyName: Species
        propertyValue: Human
      - propertyName: Phenotype/Indication
        propertyValue: Cardiovascular System Disease
      - propertyName: "# of participants"
        propertyValue: 20
      - propertyName: Description
        propertyValue: Description of Dataset
      - propertyName: url
        propertyValue: http://...
      - propertyName: Sample Collection ID
        propertyValue: SC-000
  studyId:
    type: integer
    format: int32
    description: The dataset's study id.
  study:
    $ref: "./Study.yaml"
  alias:
    type: integer
    format: int32
    description: The dataset alias
  datasetIdentifier:
    type: string
    description: The dataset identifier, long format
  objectId:
    type: string
    description: The sample collection ID, if defined
  dataUse:
    type: object
    description: The Data Use question/answer set for this dataset (used for the associated consent).
  dacApproval:
    type: boolean
    description: DAC approval/disapproval for this dataset
  nihInstitutionalCertificationFile:
    $ref: './FileStorageObject.yaml'
  updateUserId:
    type: integer
    format: int32
    description: The update user id, if available
  updateDate:
    type: string
    format: date-time
    description: The dataset update date
  indexedDate:
    type: string
    format: date-time
    description: The dataset index date
