type: object
description: |
  A dataset whose persisted Data Use shape the canonical validator would reject. Carries the
  classification label rather than the stored value, so no Other free text is exposed.
properties:
  datasetId:
    type: integer
    description: The dataset ID, so an admin can correct the record.
  classification:
    type: string
    description: Classification label, for example NONE or MULTIPLE(HMB,OTHER).
  accessManagement:
    type: string
    description: The stored access management, or "missing" where the dataset has none.
    enum:
      - open
      - controlled
      - external
      - missing
  darCount:
    type: integer
    description: Distinct submitted, unarchived Data Access Requests referencing the dataset.
  needsMatchRecompute:
    type: boolean
    description: |
      Whether a submitted, unarchived Data Access Request reaches this dataset, and so whether the
      recompute endpoint covers its stored matches.
