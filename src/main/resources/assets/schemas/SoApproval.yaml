type: object
properties:
  referenceId:
    type: string
  collectionId:
    type: integer
  kind:
    $ref: './DarKind.yaml'
  submissionDate:
    type: integer
    description: Milliseconds since the epoch.
  status:
    $ref: './SoApprovalStatus.yaml'
  approvalDate:
    type: [integer, 'null']
    description: When the SO approved, in milliseconds since the epoch. Null unless approved.
  elapsedDays:
    type: [number, 'null']
    description: Null unless approved, and for an approval dated before the submission date.
