type: object
properties:
  referenceId:
    type: string
    description: The submission's earliest original DAR; older submissions saved one DAR per dataset.
  collectionId:
    type: integer
  userId:
    type: integer
    description: The submitter.
  submissionDate:
    type: integer
    description: Milliseconds since the epoch.
  institutionId:
    type: [integer, 'null']
  institutionName:
    type: [string, 'null']
    description: The institution's current name, or its recorded name once it has been deleted.
  institutionSource:
    type: string
    enum: [RECORDED, CURRENT]
    description: RECORDED if the institution was recorded at submission, CURRENT if read from the submitter's profile.
  datasetCount:
    type: integer
  labStaffCount:
    type: integer
  internalCollaboratorCount:
    type: integer
