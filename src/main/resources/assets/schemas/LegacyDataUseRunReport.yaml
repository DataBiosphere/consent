type: object
description: |
  Outcome of one legacy Data Use run. Redacted: failures carry a dataset id, never an exception
  message, which can quote the Other free text.
properties:
  processed:
    type: integer
    description: Datasets whose matches were recomputed.
  failed:
    type: integer
    description: Datasets left unchanged because every attempt failed.
  retried:
    type: integer
    description: Datasets that failed once and were attempted again, whether or not that succeeded.
  matchesRecomputed:
    type: integer
    description: Distinct Data Access Requests whose matches were recomputed.
  failedDatasetIds:
    type: array
    description: Datasets needing follow-up, so a rerun can be scoped to them.
    items:
      type: integer
