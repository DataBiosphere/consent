type: object
description: An AI Model object.
allOf:
  - $ref: './AssetDataUse.yaml'
properties:
  modelId:
    type: [integer, string]
    description: Server-assigned id. Omit it for a new entry and send it back unchanged on an edit; an id matching none of the study's entries starts a new entry with a new id, and an unconverted study may still return a client string.
  studyId:
    type: string
    description: The study ID associated with the model.
  name:
    type: string
    description: The name of the model.
  description:
    type: string
    description: A description of the model.
  url:
    type: string
    description: The URL to the model.
  cloud:
    type: array
    items:
      type: string
    description: The cloud platforms the model is available on.
  format:
    type: string
    description: The format the model is distributed in.
  license:
    type: string
    description: The license the model is released under.
  trainedOnDatasets:
    type: array
    items:
      type: string
    description: The datasets the model was trained on.
  maintainer:
    description: The maintainer of the model.
    allOf:
      - $ref: './Maintainer.yaml'
  tags:
    type: array
    items:
      type: string
    description: Tags associated with the model.
