type: object
description: The access management and data use fields shared by models and workspaces.
properties:
  accessManagement:
    description: How access to the entry is managed.
    allOf:
      - $ref: './AccessManagement.yaml'
  dataUse:
    description: >-
      The entry's data use terms. Optional. Each field must have its documented type, and
      unknown fields are rejected. With `open` access management it must have no primary
      term; otherwise, including when access management is absent, exactly one. An update does
      not re-check an access management and data use pair the study already stores.
    allOf:
      - $ref: './DataUse.yaml'
    unevaluatedProperties: false
  dataUseSummary:
    readOnly: true
    description: The translated `dataUse` terms, computed by the server on read. Never stored; ignored on write.
    allOf:
      - $ref: './DataUseSummary.yaml'
