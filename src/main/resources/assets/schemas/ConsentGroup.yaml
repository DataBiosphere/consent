type: object
description: |
  Each Consent Group is translated into a separate Dataset. `consentGroupName`
  and `numberOfParticipants` are required when creating a new consent group —
  either via registration create, or by adding a new consent group (no
  `datasetId`) during a study update. Exactly one primary data use must be
  set: `accessManagement: open`, or exactly one of `generalResearchUse`,
  `hmb`, `poa`, `diseaseSpecificUse` (non-empty), or `otherPrimary`.
  `dataAccessCommitteeId` is required unless `accessManagement` is `open` or
  `external` — a missing `accessManagement` is treated the same as
  `controlled` and still requires a DAC.

  For an existing consent group being edited during a study update
  (identified by `datasetId`), `consentGroupName` and `numberOfParticipants`
  are both optional: a submitted `consentGroupName` is never applied — the
  server always keeps the dataset's existing stored name — and an omitted
  `numberOfParticipants` leaves the existing stored value unchanged.
properties:
  consentGroupName:
    type: string
    description: Consent Group Name
  datasetId:
    type: number
    description: The dataset id of the consent group
  accessManagement:
    description: Access Management
    type: string
    enum:
      - controlled
      - open
      - external
  numberOfParticipants:
    type: number
    description: Number of Participants
  generalResearchUse:
    type: boolean
    description: General Research Use
  hmb:
    type: boolean
    description: Health/Medical/Biomedical Research Use
  diseaseSpecificUse:
    type: array
    description: Disease-Specific Research Use
    items:
      type: string
  poa:
    type: boolean
    description: Populations, Origins, Ancestry Use
  otherPrimary:
    type: string
    description: Other
  dataAccessCommitteeId:
    type: number
    description: Data Access Committee ID
  nmds:
    type: boolean
    description: No Methods Development or validation studies (NMDS)
  gso:
    type: boolean
    description: Genetic studies only (GSO)
  pub:
    type: boolean
    description: Publication Required (PUB)
  col:
    type: boolean
    description: Collaboration Required (COL)
  irb:
    type: boolean
    description: Ethics Approval Required (IRB)
  gs:
    type: string
    description: Geographic Restriction (GS-)
  mor:
    type: boolean
    description: Publication Moratorium (MOR)
  morDate:
    type: string
    format: date
    description: Publication Moratorium Date (MOR)
  npu:
    type: boolean
    description: Non-profit Use Only (NPU)
  otherSecondary:
    type: string
    description: Other
  dataLocation:
    description: Data Location
    type: string
    enum:
      - AnVIL Workspace
      - Terra Workspace
      - TDR Location
      - Not Determined
      - Other
  url:
    type: string
    format: uri
    description: Free text field for entering URL of data
  requestLocation:
    type: string
    format: uri
    description: URL of an external location where data access requests should be submitted
  fileTypes:
    type: array
    items:
      "$ref": "./FileType.yaml"
    description: List of File Types
  data:
    type: object
    description: |
      Optional client-managed consent-group metadata. Preserved and
      round-tripped by the backend as-is; not backend-validated. Do not
      duplicate first-class fields here.
required:
  - consentGroupName
  - numberOfParticipants
