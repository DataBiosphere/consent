type: object
description: One page of every public-eligible dataset, in identifier order.
additionalProperties: false
required:
  - mode
properties:
  mode:
    type: string
    enum: [all]
  pageSize:
    type: integer
    minimum: 1
    maximum: 200
    default: 100
  cursor:
    type: string
    maxLength: 512
    description: The `nextCursor` of the previous page. Omit it for the first page.
