type: object
properties:
  userId:
    type: integer
    description: ID of the user
  email:
    type: string
    description: Email of the user
  emailPreference:
    type: boolean
    description: The user wants email notifications.
  displayName:
    type: string
    description: Name of the user
  userData:
    type: object
    description: JSON map of keys and values.  Not validated for any particular purpose.
  createDate:
    type: string
    format: date
    description: Describes the date the User was created.
  roles:
    type: array
    items:
      $ref: './UserRole.yaml'
  properties:
    $ref: './UserProperties.yaml'
  libraryCard:
    $ref: './LibraryCard.yaml'
  userStatusInfo:
    $ref: './SamUserStatusInfo.yaml'
