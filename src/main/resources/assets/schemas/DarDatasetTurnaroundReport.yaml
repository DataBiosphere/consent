type: object
properties:
  from:
    type: string
    format: date
  to:
    type: string
    format: date
  bucket:
    type: string
    enum: [DAY, WEEK, MONTH, QUARTER]
  total:
    type: integer
    description: Measured rows in the range, across all pages.
  unmeasured:
    type: integer
    description: Decided rows with no vote date, or one before the submission date, not measured.
  buckets:
    type: array
    items:
      $ref: './TurnaroundBucket.yaml'
  rows:
    type: array
    items:
      $ref: './DarDatasetTurnaround.yaml'
