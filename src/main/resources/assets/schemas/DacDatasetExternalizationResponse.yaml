type: object
properties:
  dacId:
    type: integer
    description: DAC identifier used for the operation.
  dryRun:
    type: boolean
    description: Indicates whether this was executed in dry-run mode.
  reason:
    type: string
    description: Request reason supplied by the caller.
  startedAt:
    type: integer
    format: int64
    description: Timestamp when processing started, as epoch milliseconds.
  completedAt:
    type: integer
    format: int64
    description: Timestamp when processing completed, as epoch milliseconds.
  datasetsTotalInDac:
    type: integer
    description: Number of datasets currently associated with the DAC.
  datasetsConvertedToExternal:
    type: integer
    description: Number of datasets transitioned from controlled/open to external.
  datasetsAlreadyExternal:
    type: integer
    description: Number of datasets already marked external before execution.
  darDatasetApprovalsRevoked:
    type: integer
    description: Number of DAR-dataset relationships removed.
  openElectionsCanceled:
    type: integer
    description: Number of open data-access elections canceled.
  usersWithAccessRemoved:
    type: integer
    description: Number of distinct users impacted by approval revocations.
examples:
  - dacId: 42
    dryRun: false
    reason: Policy change to external access model
    startedAt: 1745420591000
    completedAt: 1745420592417
    datasetsTotalInDac: 12
    datasetsConvertedToExternal: 9
    datasetsAlreadyExternal: 3
    darDatasetApprovalsRevoked: 41
    openElectionsCanceled: 7
    usersWithAccessRemoved: 29


