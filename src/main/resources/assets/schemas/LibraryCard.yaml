type: object
properties:
  id:
    type: integer
    description: ID of Library Card
  userId:
    type: integer
    description: ID of associated user
  userName:
    type: string
    description: Name of associated user
  userEmail:
    type: string
    description: Email of associated user
  createDate:
    type: string
    format: date
    description: Date the library card was created
  createUserId:
    type: integer
    description: ID of user who created the Library Card record
  updateDate:
    type: string
    format: date
    description: Last update date of Library card
  updateUserId:
    type: integer
    description: User who last updated the LibraryCard
examples:
  - id: 1
    userId: 2
    userName: User Smith
    userEmail: email@somewhere.com
    createDate: "2024-01-15"
    createUserId: 3
    updateDate: "2024-06-01"
    updateUserId: 4
