type: object
description: >
  A computed shelf: eligible pins first, then the ranked datasets, up to `limit`. A pin outside
  the section or the scope is dropped, an exclusion wins over a pin, and pins never take the
  result past `limit`.
additionalProperties: false
required:
  - mode
  - section
  - ranking
properties:
  mode:
    type: string
    enum: [ranking]
  section:
    type: string
    enum: [latest-data-releases, open-access-datasets]
    description: The showcase section whose eligibility rules apply.
  ranking:
    type: string
    enum: [newest]
    description: >
      `newest`: newest "new in DUOS" date first (`create_date` for open and external datasets,
      `dac_approval_date` for controlled ones), then identifier order for datasets on the same
      date. A dataset with no date is left out.
  scope:
    $ref: './ShowcaseScope.yaml'
  limit:
    type: integer
    minimum: 1
    maximum: 50
    default: 12
  pin:
    type: array
    maxItems: 50
    description: Counted before duplicates are removed.
    items:
      $ref: './ShowcaseIdentifier.yaml'
  exclude:
    type: array
    maxItems: 200
    description: Counted before duplicates are removed.
    items:
      $ref: './ShowcaseIdentifier.yaml'
