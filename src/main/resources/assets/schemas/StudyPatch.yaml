type: object
properties:
  name:
    type: string
    description: The name of the study.
  description:
    type: string
    description: A human-readable description of the study.
  studyType:
    $ref: './StudyType.yaml'
  dataTypes:
    type: array
    items:
      type: string
    description: The data types included in the study's dataset.
  phenotypeIndication:
    type: string
    description: The phenotype indication for the study.
  species:
    type: string
    description: The species for the study.
  piName:
    type: string
    description: The name of the PI of the study.
  piEmail:
    type: string
    format: email
    description: The email address of the PI of the study.
  piInstitutionId:
    type: integer
    nullable: true
    description: >
      The institution of the PI of the study. Omit the field to leave it
      unchanged; send null to clear it.
  piOrcid:
    type: string
    nullable: true
    description: >
      The ORCID identifier or URL of the PI of the study. Omit the field to
      leave it unchanged; send null (or an empty string) to clear it.
  piLinkedinUrl:
    type: string
    format: uri
    nullable: true
    description: >
      The LinkedIn profile URL of the PI of the study. Omit the field to leave
      it unchanged; send null (or an empty string) to clear it.
  piWebsiteUrl:
    type: string
    format: uri
    nullable: true
    description: >
      The website URL of the PI of the study. Omit the field to leave it
      unchanged; send null (or an empty string) to clear it.
  dataCustodianEmail:
    type: array
    items:
      type: string
    description: The data custodian email(s) for the study.
  alternativeDataSharingPlanTargetDeliveryDate:
    type: string
    description: The target delivery date for the alternative data sharing plan.
  alternativeDataSharingPlanTargetPublicReleaseDate:
    type: string
    description: The target delivery public release date for the alternative data sharing plan.
  publicVisibility:
    type: boolean
    description: Whether this study is publicly visible or not.
  externalIdentifier:
    type: string
    description: The identifier for this study in an external system (e.g. SCP1671 in Single Cell Portal).
  externalIdentifierType:
    type: string
    description: The name of the external system the identifier belongs to (e.g. Single Cell Portal).
