type: object
properties:
  datasetId:
    type: integer
    description: The unique identifier for a dataset
  datasetIdentifier:
    type: string
    description: The public DUOS identifier for a dataset
  dataUse:
    type: object
    title: DatasetSearchDataUse
    description: The data use associated with the dataset
    properties:
      primary:
        type: array
        description: The primary data uses associated with the dataset
        items:
          $ref: '../schemas/DataUse.yaml'
      secondary:
        type: array
        description: The secondary data uses associated with the dataset
        items:
          $ref: '../schemas/DataUse.yaml'
  dacId:
    type: integer
    description: The unique identifier for a DAC
  soApprovalModel:
    type: string
    enum:
      - PER_DAR
      - PRE_AUTHORIZED
    description: >-
      Which Signing Official authorization model the dataset's DAC uses. PER_DAR means the SO
      named in each Data Access Request must approve that request before the DAC reviews it;
      PRE_AUTHORIZED means the SO authorizes researchers in advance. Absent when the model
      could not be resolved at indexing time, or on documents indexed before this field
      existed; clients should treat an absent value as unknown rather than assuming a model.
  study:
    type: object
    title: DatasetSearchStudy
    description: The study associated with the dataset
