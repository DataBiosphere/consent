type: object
description: An analysis Workspace object.
allOf:
  - $ref: './AssetDataUse.yaml'
properties:
  workspaceId:
    type: [integer, string]
    description: Server-assigned id. Omit it for a new entry and send it back unchanged on an edit; an id matching none of the study's entries starts a new entry with a new id, and an unconverted study may still return a client string.
  studyId:
    type: string
    description: The study ID associated with the workspace.
  name:
    type: string
    description: The name of the workspace.
  platform:
    type: string
    description: The platform hosting the workspace.
  url:
    type: string
    description: The URL to the workspace.
  cloud:
    type: array
    items:
      type: string
    description: The cloud platforms the workspace runs on.
  description:
    type: string
    description: A description of the workspace.
  tools:
    type: array
    items:
      type: string
    description: The tools available in the workspace.
  access:
    type: string
    deprecated: true
    description: Free-text access level of the workspace. Superseded by `accessManagement`.
  tags:
    type: array
    items:
      type: string
    description: Tags associated with the workspace.
