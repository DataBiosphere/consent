type: object
properties:
  updateDate:
    type: string
    format: date-time
    description: The latest update date of the DAR
  submissionDate:
    type: string
    format: date-time
    description: The date the DAR was submitted
  projectTitle:
    type: string
    description: The DAR project title
  darCode:
    type: string
    description: The DAR code
  nonTechRus:
    type: string
    description: The DAR non-technical research use statement
  expired:
    type: boolean
    description: Whether the DAR is expired
  referenceId:
    type: string
    description: The reference identifier for the DAR
  piName:
    type: string
    description: The requesting principal investigator's display name
  institutionName:
    type: string
    description: The requesting principal investigator's institution
