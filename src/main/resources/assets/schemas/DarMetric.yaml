type: object
properties:
  updateDate:
    type: string
    format: date-time
    description: The latest update date of the DAR
  submissionDate:
    type: string
    format: date-time
    description: The date the DAR was submitted
  projectTitle:
    type: string
    description: The DAR project title
  darCode:
    type: string
    description: The DAR code
  nonTechRus:
    type: string
    description: The DAR's non-technical summary
  rus:
    type: string
    description: The DAR's research use statement
  expired:
    type: boolean
    description: >-
      Whether access has ended, by the term running out (see expirationDate) or by a closeout (see
      closeoutDate)
  expirationDate:
    type: integer
    format: int64
    description: >-
      When the term of access runs out, in milliseconds since the epoch: 365 days after the
      submission date of the newest approved submission, original DAR or progress report. The term
      runs from that submission date, not from the day the DAC approved it, which is the rule
      `expired` and every other grant check applies. Still sent when a closeout ended access
      earlier.
  closeoutDate:
    type: integer
    format: int64
    description: >-
      When a closeout ended access before its term ran out, in milliseconds since the epoch.
      Omitted when the DAR was not closed out, and when the closeout was filed after the term had
      already run out, since that access expired.
  referenceId:
    type: string
    description: The reference identifier for the DAR
  institutionName:
    type: string
    description: >-
      The current institution of the requester the DAR was granted to. Omitted, never sent as
      null, when the requester has no institution on record or that institution no longer exists.
      Also withheld from the dataset-scoped route when the dataset belongs to no study: such a
      dataset is readable by any authenticated caller, so nothing about the caller was established
      and the requester's affiliation would be enumerable by walking dataset ids. Callers admitted
      on their own merits - an admin, the dataset's creator, or a reader of its study - are not
      subject to that withholding. The requester's name is never included, whatever the caller.
