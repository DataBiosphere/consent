type: object
properties:
  updateDate:
    type: string
    format: date-time
    description: The latest update date of the DAR
  submissionDate:
    type: string
    format: date-time
    description: The date the DAR was submitted
  projectTitle:
    type: string
    description: The DAR project title
  darCode:
    type: string
    description: The DAR code
  nonTechRus:
    type: string
    description: The DAR's non-technical summary
  rus:
    type: string
    description: The DAR's research use statement
  expired:
    type: boolean
    description: Whether the DAR is expired
  referenceId:
    type: string
    description: The reference identifier for the DAR
  institutionName:
    type: string
    nullable: true
    description: >-
      The institution of the requester the DAR was granted to. Withheld, and omitted from the
      response rather than sent as null, when the dataset belongs to no study: such a dataset is
      readable by any authenticated caller, so nothing about the caller was established and the
      requester's affiliation would be enumerable by walking dataset ids. Callers admitted on
      their own merits - an admin, the dataset's creator, or a reader of its study - always
      receive it. The requester's name is never included, whatever the caller.
