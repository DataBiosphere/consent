type: object
properties:
  from:
    type: string
    format: date
  to:
    type: string
    format: date
  bucket:
    type: string
    enum: [DAY, WEEK, MONTH, QUARTER]
  total:
    type: integer
    description: Records created in the range.
  buckets:
    type: array
    description: Records created per bucket; a bucket with none is left out.
    items:
      $ref: './CreatedBucket.yaml'
