    FileStorageObject:
      $ref: './schemas/FileStorageObject.yaml'
    FileStorageObjectCategoryUpdateRequest:
      $ref: './schemas/FileStorageObjectCategoryUpdateRequest.yaml'
    Institution:
      $ref: './schemas/Institution.yaml'
    LibraryCard:
      $ref: './schemas/LibraryCard.yaml'
    MailMessage:
      $ref: './schemas/MailMessage.yaml'
    PaginationResponse:
      $ref: './schemas/PaginationResponse.yaml'
