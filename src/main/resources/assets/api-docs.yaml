    post:
      summary: Store DAR IRB Document
      operationId: apiDarV2ReferenceIdIrbDocumentPost
      description: |
        Store an IRB Document for a Data Access Request.
        Previous document is deleted.
      parameters:
        - name: referenceId
          in: path
          description: The referenceId of the Data Access Request
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
      tags:
        - Data Access Request
      responses:
