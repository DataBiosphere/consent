              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MatchResult'
        401:
          description: Unauthorized.
        429:
          description: Too Many Requests - rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
