  /api/user/acknowledgements/{key}:
    get:
      summary: Get Acknowledgement by key
      operationId: apiUserAcknowledgementsKeyGet
      description: Obtains a specific acknowledgement by acknowledgement key.
      parameters:
        - name: key
          in: path
          description: The name of the key.
          required: true
          schema:
            type: string
      tags:
        - User
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Acknowledgement'
        401:
          description: Unauthorized, log in and try the operation again.
        404:
          description: No acknowledgement found for the given key.
        429:
          description: Too Many Requests - rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: Error processing the request.
    delete:
      summary: ADMIN ONLY - Delete Acknowledgement by key
      operationId: apiUserAcknowledgementsKeyDelete
      description: Deletes a specific acknowledgement for the current user by acknowledgement key.  Returns the deleted acknowledgement.
      parameters:
        - name: key
          in: path
          description: The name of the key.
          required: true
          schema:
            type: string
      tags:
        - User
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Acknowledgement'
        401:
          description: Unauthorized, log in and try the operation again.
        404:
          description: No acknowledgement found for the given key.
        429:
          description: Too Many Requests - rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: Error processing the request.
  /api/user/acknowledgements:
    post:
      operationId: apiUserAcknowledgementsPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
              examples:
                - [ "key1", "key2", "key3" ]
      tags:
        - User
      summary: Set acknowledgements for a user
      description: Records an acknowledgement record for each entry supplied
      responses:
        200:
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcknowledgementMap'
        400:
          description: The request isn't in the proper format.
        401:
          description: |
            Unauthorized, log in and try the operation again.
            Closeout Acknowledgements can only be submitted by Chairpersons
        429:
          description: Too Many Requests - rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: Error processing the request.
    get:
      tags:
        - User
      summary: Obtains all acknowledgements for a user
      operationId: apiUserAcknowledgementsGet
      description: Obtains an acknowledgement record for each entry supplied.  Missing entries will not have a key in the response
      responses:
        200:
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcknowledgementMap'
        401:
          description: Unauthorized, log in and try the operation again.
        429:
          description: Too Many Requests - rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: Error processing the request.
