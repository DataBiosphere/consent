  /api/dac/{dacId}/member/{userId}:
    post:
      summary: Add DAC Member
      operationId: apiDacDacIdMemberUserIdPost
      description: Adds a User as a Member to a Data Access Committee
      parameters:
        - name: dacId
          in: path
          description: The DAC ID
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          description: The User ID
          required: true
          schema:
            type: integer
      tags:
        - DAC
      responses:
        200:
          description: The added DAC Member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        404:
          description: No DAC or User found with the provided ID
        409:
          description: User is already a member of the DAC
        429:
          description: Too Many Requests - rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: Internal Server Error
    delete:
      summary: Remove DAC Member
      operationId: apiDacDacIdMemberUserIdDelete
      parameters:
        - name: dacId
          in: path
          description: The DAC ID
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          description: The User ID
          required: true
          schema:
            type: integer
      tags:
        - DAC
      responses:
        200:
          description: Dac member successfully removed
        404:
          description: No DAC or User found with the provided ID
        429:
          description: Too Many Requests - rate limit exceeded
