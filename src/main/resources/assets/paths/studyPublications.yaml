get:
  summary: Registered primary publications for a study
  operationId: apiStudyAssetsPublicationsGet
  parameters:
    - name: studyId
      in: path
      required: true
      schema: { type: integer }
  tags: [Study]
  responses:
    200:
      description: Study publications
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '../schemas/Publication.yaml' }
    404: { description: Study not found, or not visible to this user }
