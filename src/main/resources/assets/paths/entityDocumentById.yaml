get:
  summary: Get document metadata by entity and file id
  operationId: findDocumentByEntity
  description: Returns FileStorageObject metadata only. File bytes are not returned.
  parameters:
    - name: entity
      in: path
      required: true
      description: Entity type
      schema:
        type: string
        enum: [dataset, study]
    - name: entityId
      in: path
      required: true
      description: Entity identifier
      schema:
        type: string
    - name: id
      in: path
      required: true
      description: FileStorageObject id
      schema:
        type: integer
  tags:
    - Document
  responses:
    200:
      description: FileStorageObject metadata
      content:
        application/json:
          schema:
            $ref: '../schemas/FileStorageObject.yaml'
    401:
      description: Unauthorized
    403:
      description: Forbidden
    404:
      description: Not Found

put:
  summary: Update FileStorageObject category
  operationId: updateDocumentCategoryByEntity
  description: Updates only the FileStorageObject category for re-categorization. File content is immutable.
  parameters:
    - name: entity
      in: path
      required: true
      description: Entity type
      schema:
        type: string
        enum: [dac, dar, dataset, study]
    - name: entityId
      in: path
      required: true
      description: Entity identifier
      schema:
        type: string
    - name: id
      in: path
      required: true
      description: FileStorageObject id
      schema:
        type: integer
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/FileStorageObjectCategoryUpdateRequest.yaml'
  tags:
    - Document
  responses:
    200:
      description: Updated FileStorageObject metadata
      content:
        application/json:
          schema:
            $ref: '../schemas/FileStorageObject.yaml'
    400:
      description: Bad request
    401:
      description: Unauthorized
    403:
      description: Forbidden
    404:
      description: Not Found

