get:
  summary: Get datasets from currently authenticated user's DACs
  operationId: apiUserMeDacDatasetsV2Get
  description: |
    Get datasets from currently authenticated user's DACs.
    Note that study information is not included in dataset list endpoints but is provided in
    individual dataset endpoints.
  tags:
    - User
  responses:
    200:
      description: List of Datasets that are under the purview of User's dacs
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../schemas/Dataset.yaml'
    401:
      description: Unauthorized.
    404:
      description: User not found or no datasets found for user
    429:
      description: Too Many Requests - rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
    500:
      description: Server error
