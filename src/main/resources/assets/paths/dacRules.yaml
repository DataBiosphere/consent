get:
  summary: Get a list of automation rules available for DACs in DUOS
  operationId: apiDacRulesGet
  description: View the rules available.
  tags:
    - DAC
  responses:
    200:
      description: The list of Data Access Committee automatic processing rules
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../schemas/DacAutomationRule.yaml'
    429:
      description: Too Many Requests - rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
