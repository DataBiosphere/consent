get:
  summary: Research outputs self-reported in study progress reports
  operationId: apiMetricsResearchOutputsStudyIdGet
  parameters:
    - name: studyId
      in: path
      required: true
      schema: { type: integer }
  tags: [Metrics]
  responses:
    200:
      description: Presentations, publications, and intellectual property
      content:
        application/json:
          schema: { $ref: '../schemas/StudyResearchOutputs.yaml' }
    404: { description: Study not found, or not visible to this user }
