get:
  summary: Get DAC by ID
  operationId: apiDacDacIdGet
  description: Get Data Access Committee by Id
  parameters:
    - name: dacId
      in: path
      description: The DAC ID
      required: true
      schema:
        type: integer
  tags:
    - DAC
  responses:
    200:
      description: The Data Access Committee matching the provided ID
      content:
        application/json:
          schema:
            $ref: '../schemas/Dac.yaml'
    401:
      description: Unauthorized.
    404:
      description: No DAC found with the given ID
    429:
      description: Too Many Requests - rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
    500:
      description: Internal Server Error
delete:
  summary: Delete DAC by ID
  operationId: apiDacDacIdDelete
  description: Delete Data Access Committee by Id
  parameters:
    - name: dacId
      in: path
      description: The DAC ID
      required: true
      schema:
        type: integer
  tags:
    - DAC
  responses:
    200:
      description: The Data Access Committee matching the provided ID was deleted
      content:
        application/json:
          schema:
            $ref: '../schemas/Dac.yaml'
    404:
      description: No DAC found with the given ID
    429:
      description: Too Many Requests - rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
    500:
      description: Internal Server Error
