get:
  summary: Granted DARs for a study
  operationId: apiMetricsDarSummariesStudyIdGet
  parameters:
    - name: studyId
      in: path
      required: true
      schema: { type: integer }
  tags: [Metrics]
  responses:
    200:
      description: Granted DAR summaries, newest first
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '../schemas/DarMetric.yaml' }
    404: { description: Study not found, or not visible to this user }
