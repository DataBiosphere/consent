get:
  summary: List of Dataset Study Summary objects
  operationId: apiDatasetV3Get
  description: |
    Provides a list of datasets and their associated study information in a very minimal format.
  tags:
    - Dataset
  responses:
    200:
      description: List of Dataset Study Summary objects
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../schemas/DatasetStudySummary.yaml'
post:
  summary: Creates a Study and its Datasets from a registration payload
  operationId: apiDatasetV3Post
  description: |
    Creates a Study and one Dataset per consent group from a registration
    payload. Request validation is performed by backend DTO/domain validators,
    not by the legacy dataset-registration-schema_v1.json file; this OpenAPI
    document is the authoritative, forward-looking description of the
    request/response contract.
  requestBody:
    description: |
      Registration payload and optional file for an alternative data sharing
      plan. The registration payload is always required. If a file is also
      provided, then alternative data sharing information is required in the
      payload.
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            dataset:
              $ref: '../schemas/DatasetRegistrationSchemaV1.yaml'
            alternativeDataSharingPlan:
              description: Optional alternative data sharing plan
              type: string
              contentMediaType: application/octet-stream
            consentGroups[0].nihInstitutionalCertificationFile:
              description: Certification file for first consent group (others omitted because swagger does not allow variable number of file uploads)
              type: string
              contentMediaType: application/octet-stream
  tags:
    - Dataset
  responses:
    201:
      description: Successfully created Datasets from Registration instance
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../schemas/Dataset.yaml'
    400:
      description: Bad Request (invalid input)
    409:
      description: Dataset Name given is already in use by another dataset
    500:
      description: Internal Error (something went wrong processing a valid input)