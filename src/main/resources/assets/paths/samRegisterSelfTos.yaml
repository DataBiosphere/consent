post:
  summary: Accept ToS for current user in the Sam system using current login credentials
  operationId: apiSamRegisterSelfTosPost
  description: Accept ToS for current user in the Sam system using current login credentials
  tags:
    - Sam
  responses:
    200:
      description: Accept ToS
      content:
        application/json:
          schema:
            $ref: '../schemas/SamTosResponse.yaml'
    429:
      description: Too Many Requests - rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
    500:
      description: Internal Server Error
delete:
  summary: Reject ToS for current user in the Sam system using current login credentials
  operationId: apiSamRegisterSelfTosDelete
  description: Reject ToS for current user in the Sam system using current login credentials
  tags:
    - Sam
  responses:
    200:
      description: Reject ToS
      content:
        application/json:
          schema:
            $ref: '../schemas/SamTosResponse.yaml'
    429:
      description: Too Many Requests - rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
    500:
      description: Internal Server Error
