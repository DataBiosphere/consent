get:
  summary: Dataset Metrics
  description: get Data Access Requests associated to a datasetId
  parameters:
    - name: datasetId
      in: path
      required: true
      schema:
        type: integer
  tags:
    - Metrics
  responses:
    200:
      description: Dataset Metrics
      content:
        application/json:
          schema:
            $ref: '../schemas/DatasetMetrics.yaml'
    404:
      description: Dataset with specified ID does not exist
    500:
      description: Internal Server Error
