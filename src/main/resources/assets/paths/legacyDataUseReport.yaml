get:
  description: |
    Classification counts over every persisted dataset Data Use, used to reconcile the legacy
    noncanonical population before and after it is normalized.
    Counts only: the response carries no dataset identifier, Data Use JSON, or Other free text.
  tags:
    - Dataset
    - Admin
  responses:
    200:
      description: Returns classification counts for every persisted dataset Data Use.
      content:
        application/json:
          schema:
            $ref: '../schemas/PersistedDataUseReport.yaml'
    401:
      description: Unauthorized - The requester is not authenticated.
    403:
      description: Forbidden - Admin use only.
    429:
      description: Too Many Requests - rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
    500:
      description: Internal Server Error - An error occurred while processing the request.

  operationId: apiDatauseLegacyReportGet
