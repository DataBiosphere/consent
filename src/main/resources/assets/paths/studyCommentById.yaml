delete:
  summary: Delete the requesting user's own comment on a study
  operationId: apiStudyCommentsDelete
  parameters:
    - name: studyId
      in: path
      required: true
      schema: { type: integer }
    - name: commentId
      in: path
      required: true
      schema: { type: integer }
  tags: [Study]
  responses:
    204: { description: Comment deleted }
    404:
      description: >
        Study not found or not visible to this user, or the comment does not
        exist on that study or does not belong to the requesting user
