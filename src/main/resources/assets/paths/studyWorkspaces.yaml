get:
  summary: Registered workspaces for a study
  operationId: apiStudyAssetsWorkspacesGet
  parameters:
    - name: studyId
      in: path
      required: true
      schema: { type: integer }
  tags: [Study]
  responses:
    200:
      description: Study workspaces
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '../schemas/Workspace.yaml' }
    404: { description: Study not found, or not visible to this user }
