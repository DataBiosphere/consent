get:
  summary: Get Mail Messages
  description: |
    Admin only feature returns MailMessage list filtered by EmailType.
  parameters:
    - name: type
      in: path
      description: EmailType.  Possible values
      required: true
      schema:
        type: string
        enum:
          - COLLECT
          - NEW_CASE
          - REMINDER
          - NEW_DAR
          - DISABLED_DATASET
          - CLOSED_DATASET_ELECTION
          - DATA_CUSTODIAN_APPROVAL
          - RESEARCHER_DAR_APPROVED
          - ADMIN_FLAGGED_DAR_APPROVED
          - DAR_CANCEL
          - DELEGATE_RESPONSIBILITIES
          - NEW_RESEARCHER
          - RESEARCHER_APPROVED
          - NEW_DATASET
          - NEW_DAA_REQUEST
          - NEW_DAA_UPLOAD_RESEARCHER
          - NEW_DAA_UPLOAD_SO
          - DATASET_DENIED
          - DATASET_APPROVED
          - DAR_EXPIRED
          - DAR_EXPIRATION_REMINDER
          - NEW_PROGRESS_REPORT_REQUEST
          - NEW_PROGRESS_REPORT_CASE
          - RESEARCHER_PROGRESS_REPORT_APPROVED
          - RESEARCHER_CLOSEOUT_COMPLETED
          - SUBMITTED_CLOSEOUT
          - NEW_LIBRARY_CARD_ISSUED
          - SO_DAR_SUBMITTED
          - SO_DAR_APPROVED
          - SO_PROGRESS_REPORT_SUBMITTED
          - SO_PROGRESS_REPORT_APPROVED
          - DAC_RADAR_APPROVED
          - NEW_DAR_SO_NEEDS_TO_APPROVE
          - DAC_VOTE_REMINDER_DIGEST
    - name: limit
      in: query
      description: Number of results to return.  Defaults to 20 if unset.
      required: false
      schema:
        type: integer
    - name: offset
      in: query
      description: Offset value to page results.  Defaults to 0 if unset.
      required: false
      schema:
        type: integer
  tags:
    - Admin
    - Mail
  responses:
    200:
      description: A list of Mail Messages
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../schemas/MailMessage.yaml'
    401:
      description: Unauthorized.
    500:
      description: Internal Server Error