get:
  operationId: apiMetricsReportStudyStudyIdGet
  summary: DAR trend report for one study
  description: |
    One of the DAR trend reports, covering only DARs that request the study's datasets and, in dataset-level figures, only those datasets. The datasets are the ones in the study now.

    Readable by whoever can read the study's granted DARs (`/api/metrics/dar-summaries/study/{studyId}`): the study's creator and custodians, admins, and any authenticated user once the study is publicly visible. No DAC role is needed and there is no DAC scope.

    Because that audience is wider than the unscoped reports', the response carries totals only. `rows` is always empty. The volume report's `institutions` and `researchers` are always empty and its buckets omit `researcherCount` and `institutionCount`, so nothing says who requested the study's data. Otherwise each report has the shape and rules of its unscoped counterpart, `/api/metrics/{report}`.

    The reports that roll decisions up per DAR (`dar-decisions`, `dar-decision-turnaround`) are not served here: a DAR's other datasets can belong to other studies. The unscoped reports' `limit`, `offset` and `dacId` parameters are accepted and ignored.
  tags:
    - Metrics
  parameters:
    - name: report
      in: path
      required: true
      description: The report to read.
      schema:
        type: string
        enum:
          - dar-volume
          - dar-dataset-decisions
          - dar-dataset-decision-turnaround
          - dar-expirations
          - dar-renewals
    - name: studyId
      in: path
      required: true
      schema:
        type: integer
    - name: from
      in: query
      required: true
      description: First date to include, as yyyy-MM-dd, from 1900 to 9999. The access-end date for dar-expirations, the submission date for the rest.
      schema:
        type: string
        format: date
    - name: to
      in: query
      required: true
      description: Last date to include, as yyyy-MM-dd, from 1900 to 9999. Not before from.
      schema:
        type: string
        format: date
    - name: bucket
      in: query
      required: false
      description: Date bucket for the counts.
      schema:
        type: string
        enum: [day, week, month, quarter]
        default: quarter
  responses:
    200:
      description: The report's counts per bucket, with no rows.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '../schemas/DarVolumeReport.yaml'
              - $ref: '../schemas/DarDatasetDecisionReport.yaml'
              - $ref: '../schemas/DarDatasetTurnaroundReport.yaml'
              - $ref: '../schemas/DarExpirationReport.yaml'
              - $ref: '../schemas/DarRenewalReport.yaml'
    400:
      description: Missing or invalid query parameter.
    401:
      description: Unauthorized.
    404:
      description: Study not found or not visible to this user, or no such report for a study.
    429:
      description: Too Many Requests - rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
    500:
      description: Internal Server Error
