post:
  summary: Index dataset by id
  operationId: apiDatasetIndexDatasetIdPost
  description: Index a specific dataset in the system
  parameters:
    - name: datasetId
      in: path
      description: id of the dataset
      required: true
      schema:
        type: integer
  tags:
    - Admin
    - Dataset
  responses:
    200:
      description: The dataset has been indexed
    401:
      description: Unauthorized.
    404:
      description: Dataset not found
    429:
      description: Too Many Requests - rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
delete:
  summary: Delete dataset index by id
  operationId: apiDatasetIndexDatasetIdDelete
  description: Delete a specific dataset index in the system
  parameters:
    - name: datasetId
      in: path
      description: id of the dataset
      required: true
      schema:
        type: integer
  tags:
    - Admin
    - Dataset
  responses:
    200:
      description: The dataset index has been deleted
    401:
      description: Unauthorized.
    429:
      description: Too Many Requests - rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
