get:
  summary: Get document metadata by entity
  operationId: apiDocumentEntityEntityIdGet
  description: Returns metadata for all non-deleted file storage objects associated with the given entity and entity id.
  tags:
    - Document
  parameters:
    - name: entity
      in: path
      required: true
      description: Entity type
      schema:
        type: string
        enum: [dac, dar, dataset, study]
    - name: entityId
      in: path
      description: Entity identifier
      required: true
      schema:
        type: string
  responses:
    200:
      description: Returns file metadata records. Empty list is returned when there are no documents.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../schemas/FileStorageObject.yaml'
    401:
      description: Unauthorized
    403:
      description: Forbidden
    404:
      description: Not Found
post:
  summary: Upload a document for an entity
  operationId: apiDocumentEntityEntityIdPost
  description: Uploads a document and returns FileStorageObject metadata only (no file bytes).
  tags:
    - Document
  parameters:
    - name: entity
      in: path
      required: true
      description: Entity type
      schema:
        type: string
        enum: [dac, dar, dataset, study]
    - name: entityId
      in: path
      description: Entity identifier
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          required: [file, category]
          properties:
            file:
              type: string
              format: binary
              description: The file to upload
            category:
              type: string
              description: File category
              enum: [irbCollaborationLetter, dataUseLetter, alternativeDataSharingPlan, nihInstitutionalCertification, dataAccessAgreement]
  responses:
    201:
      description: File uploaded successfully
      content:
        application/json:
          schema:
            $ref: '../schemas/FileStorageObject.yaml'
    400:
      description: Invalid category or category/entity mismatch
    401:
      description: Unauthorized
    403:
      description: Forbidden
    404:
      description: Not Found
    500:
      description: Internal server error
