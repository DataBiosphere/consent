get:
  summary: Studies created over time
  operationId: apiMetricsStudiesGet
  description: |
    Admins, and DAC chairs and members for their DACs (see dacId). Studies created in the range,
    per bucket of their create date.
    A deleted study isn't counted. Scoped to DACs, a study counts when one of its datasets is now
    in them.
  parameters:
    - name: from
      in: query
      required: true
      description: First create date to include, as yyyy-MM-dd, from 1900 to 9999.
      schema:
        type: string
        format: date
    - name: to
      in: query
      required: true
      description: Last create date to include, as yyyy-MM-dd, from 1900 to 9999. Not before from.
      schema:
        type: string
        format: date
    - name: bucket
      in: query
      required: false
      description: Create-date bucket for the counts.
      schema:
        type: string
        enum: [day, week, month, quarter]
        default: quarter
    - name: dacId
      in: query
      required: false
      description: Repeatable. Limits the report to studies with a dataset in these DACs, which a chair or member must be on. Without it, an admin reads every DAC and a chair or member their own.
      schema:
        type: array
        items:
          type: integer
      style: form
      explode: true
  tags:
    - Metrics
    - Admin
    - DAC
  responses:
    200:
      description: The total and counts per bucket.
      content:
        application/json:
          schema:
            $ref: '../schemas/CreatedReport.yaml'
    400:
      description: Missing or invalid query parameter.
    401:
      description: Unauthorized.
    403:
      description: Not an admin, chair or member, or not on a requested DAC.
    429:
      description: Too Many Requests - rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
    500:
      description: Internal Server Error
