    get:
      summary: Get All Datasets for DAC
      operationId: apiDacDacIdDatasetsGet
      description: |
        List all Datasets of a DAC. The datasets returned from this endpoint are limited in the 
        volume of data returned. To get the full dataset, use the `/datasets/{datasetId}` endpoint.
        Note that study information is not included in dataset list endpoints but is provided in
        individual dataset endpoints.
      parameters:
        - name: dacId
          in: path
          description: The DAC ID
          required: true
          schema:
            type: integer
      tags:
        - DAC
      responses:
        200:
          description: The list of datasets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '../schemas/Dataset.yaml'
        404:
          description: No DAC found with the provided ID
        429:
          description: Too Many Requests - rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '../schemas/ErrorResponse.yaml'
        500:
          description: Internal Server Error
