get:
  summary: Registered clinical trials for a study
  operationId: apiStudyAssetsClinicalTrialsGet
  parameters:
    - name: studyId
      in: path
      required: true
      schema: { type: integer }
  tags: [Study]
  responses:
    200:
      description: Study clinical trials
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '../schemas/ClinicalTrial.yaml' }
    404: { description: Study not found, or not visible to this user }
