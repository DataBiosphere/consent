get:
  summary: Get Email Sends by Date Range.
  operationId: apiMailSendsGet
  description: |
    Admin only feature returns the emails sent in a Date Range, one entry per send rather than per recipient, newest first. A send is the emails of one type and entity reference created no more than 10 minutes apart; a send that crosses a range boundary is split there.
  parameters:
    - name: start
      in: query
      description: | 
        Earliest Date to search in MM/dd/yyyy format. (e.g. 05/19/2019)
      required: true
      schema:
        type: string
    - name: end
      in: query
      description: |
        End of the range in MM/dd/yyyy format (e.g. 05/20/2022), read as the start of that day, so emails created on it are excluded. Defaults to the end of today if empty.
      required: false
      schema:
        type: string
    - name: limit
      in: query
      description: Number of sends to return. Defaults to 20 if unset. Must be from 0 to 1000.
      required: false
      schema:
        type: integer
    - name: offset
      in: query
      description: Offset value to page results.  Defaults to 0 if unset. May not be negative.
      required: false
      schema:
        type: integer
  tags:
    - Admin
    - Mail
  responses:
    200:
      description: A list of email sends
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../schemas/MailSend.yaml'
    400:
      description: Bad Request - Check that start is provided, dates are in the MM/dd/yyyy format, limit is from 0 to 1000 and offset is not negative.
    401:
      description: Unauthorized.
    429:
      description: Too Many Requests - rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
    500:
      description: Internal Server Error
