get:
  summary: Find all DAAs
  operationId: apiDaaGet
  description: Fetches all DAAs
  tags:
    - DAA
  responses:
    200:
      description: Fetched all Data Access Agreements
      content:
        application/json:
          schema:
            $ref: '../schemas/DataAccessAgreement.yaml'
    429:
      description: Too Many Requests - rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
    500:
      description: Internal Server Error
