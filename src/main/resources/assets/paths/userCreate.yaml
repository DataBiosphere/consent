post:
  summary: Create User
  operationId: apiUserCreatePost
  requestBody:
    description: |
      Creates a User. Admins are allowed to create users with the following roles:
        - Admin
        - Alumni
        - DataSubmitter
        - ITDirector      
        - Researcher
        - ServiceAccount
        - SigningOfficial
      Chairpersons and Signing Officials are only allowed to create users with the Researcher
      role. Chairpersons can subsequently add created users to DACs they manage as Members or
      Chairpersons.

      Each role must include both a roleId and a name, and they must refer to the same role.
      If roles is omitted or empty, the user is created with the Researcher role.
    required: true
    content:
      application/json:
        schema:
          type: object
          title: CreateUserRequest
          properties:
            displayName:
              type: string
            email:
              type: string
            emailPreference:
              type: boolean
            roles:
              type: array
              items:
                allOf:
                  - $ref: '../schemas/UserRole.yaml'
                  - required:
                      - roleId
                      - name
  tags:
    - User
  responses:
    200:
      description: Returns the created user.
      content:
        application/json:
          schema:
            $ref: '../schemas/User.yaml'
    400:
      description: |
        Malformed user entity, or a role whose roleId and name are missing or refer to
        different roles.
    403:
        description: |
          Forbidden. The user does not have permission to create a user with the specified roles
    429:
      description: Too Many Requests - rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
