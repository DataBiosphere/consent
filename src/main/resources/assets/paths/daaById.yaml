post:
  summary: Create a DAA
  operationId: apiDaaDacDacIdPost
  description: Create a Data Access Agreement
  parameters:
    - name: dacId
      in: path
      description: The DAC ID
      required: true
      schema:
        type: integer
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            file:
              type: string
              contentMediaType: application/octet-stream
  tags:
    - DAA
  responses:
    200:
      description: Successfully created a Data Access Agreement
      content:
        application/json:
          schema:
            $ref: '../schemas/DataAccessAgreement.yaml'
    403:
      description: User not authorized to create DAA for a DAC.
    404:
      description: Dac Not Found
    429:
      description: Too Many Requests - rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
    500:
      description: Internal Server Error
