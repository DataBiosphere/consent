get:
  summary: Get DAR Collection with the election history for each DAR in the Collection By Collection ID
  description: Returns a single DAR Collection with the complete election history for each DAR in the Collection
  tags:
    - DAR Collection
  parameters:
    - name: collectionId
      in: path
      description: DAR Collection Id
      required: true
      schema:
        type: integer
  responses:
    200:
      description: Returns a single DAR Collection with the complete election history for each DAR in the Collection
      content:
        application/json:
          schema:
            $ref: '../schemas/DarCollection.yaml'
    404:
      description: Not Found
    500:
      description: Internal Server Error