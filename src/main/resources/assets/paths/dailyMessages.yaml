get:
  summary: Send Daily Notifications
  operationId: apiEmailNotifierDailyMessagesGet
  description: Send expiration notices for DARs, Vote Reminders, and New Study/Data notices
  tags:
    - Notifier
  responses:
    200:
      description: Notification process started.
    401:
      description: Not authenticated.
    403:
      description: Not authorized.
    429:
      description: Too Many Requests - rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
    500:
      description: Server error.
