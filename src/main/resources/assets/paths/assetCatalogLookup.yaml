get:
  summary: Resolve a DUOS identifier
  operationId: lookupAssetIdentifier
  description: >-
    Resolves a dataset (`DUOS-000123`), model (`DUOS-M-000045`), workspace (`DUOS-W-…`) or
    biospecimen (`DUOS-B-…`) identifier, which must be in its canonical form. A live or retired
    asset is returned only when the caller can read it, by the dataset GET's rule for a dataset and
    the study's rule for an asset; otherwise the response is 404, as for an unknown identifier. A
    removed asset returns only its type and status, to any signed-in user. After an ad hoc alias
    change a dataset's old identifier still resolves, with its current one as `identifier`.
  tags:
    - Asset Catalog
  parameters:
    - name: identifier
      in: path
      required: true
      schema:
        type: string
  responses:
    200:
      description: What the identifier names
      content:
        application/json:
          schema:
            $ref: '../schemas/AssetLookup.yaml'
    401:
      description: Unauthorized
    404:
      description: Unknown or malformed identifier, or a live or retired asset the caller cannot read
    500:
      description: Server error
