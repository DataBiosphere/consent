get:
  summary: Institution GET
  operationId: apiInstitutionsIdGet
  description: Fetches Institution based on id param
  tags:
    - Institutions
  parameters:
    - name: id
      in: path
      description: Institution ID
      required: true
      schema:
        type: string
  responses:
    200:
      description: Returns target institution and its signing officials.
        Admin will see all details while non-Admins will only see a subset.
      content:
        application/json:
          schema:
            $ref: '../schemas/Institution.yaml'
    404:
      description: Institution not found
    500:
      description: Internal Server Error
patch:
    summary: Institution PATCH
    operationId: apiInstitutionsIdPatch
    description: |
      Updates institution based on id and json payload. 
      Does not update signing officials of an institution
      ## Note: This is a partial update, so not all fields are required. 
      Fields that are provided with empty values (strings or arrays) will be cleared.
      #### Updatable fields:
      * name: If empty, no update will occur
      * itDirectorName
      * itDirectorEmail
      * institutionUrl
      * dunsNumber: Set to 0 to clear value
      * orgChartUrl
      * verificationUrl
      * verificationFileName
      * organizationType
      * domains: Set to empty array to clear domains
    tags:
        - Institutions
    parameters:
        - name: id
          in: path
          description: Institution ID
          required: true
          schema:
              type: integer
    requestBody:
        description: |
          Required JSON payload representing updated Institution fields.
        required: true
        content:
          application/json:
              schema:
                $ref: '../schemas/Institution.yaml'
              example: {
                "name": "New Name",
                "itDirectorName": "New IT Director",
                "itDirectorEmail": "New IT Director Email",
                "institutionUrl": "https://new-institution-url.edu",
                "dunsNumber": 0,
                "orgChartUrl": "https://new-org-chart-url.edu",
                "verificationUrl": "https://new-verification-url.edu",
                "verificationFileName": "new-verification-file.pdf",
                "organizationType": "For-Profit",
                "domains": ["domain1.edu", "domain2.edu"]
              }
    responses:
        200:
          description: Updates and returns target institution
        400:
          description: Bad Request
        404:
          description: Institution not found
        500:
          description: Internal Server Error
put:
  summary: Institution UPDATE
  operationId: apiInstitutionsIdPut
  description: Updates institution based on id and json payload. Does not update signing officials of an institution
  tags:
    - Institutions
  parameters:
    - name: id
      in: path
      description: Institution ID
      required: true
      schema:
        type: string
  requestBody:
    description: Required JSON payload representing updated Institution
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/Institution.yaml'
  responses:
    200:
      description: Updates and returns target institution
    400:
      description: Bad Request
    404:
      description: Institution not found
    500:
      description: Internal Server Error
delete:
  summary: Institution DELETE
  operationId: apiInstitutionsIdDelete
  description: Deletes institution based on id
  tags:
    - Institutions
  parameters:
    - name: id
      in: path
      description: Institution ID
      required: True
      schema:
        type: string
  responses:
    204:
      description: Deletes target institution (no return entity)
    404:
      description: Institution not found
    500:
      description: Internal Server Error