post:
  summary: Create a file upload for a support request
  operationId: supportUploadPost
  description: Create a file upload for a support request
  tags:
    - Support
  requestBody:
    content:
      application/binary:
        schema: {}
  responses:
    201:
      description: A token that represents the uploaded file
      content:
        application/json:
          schema:
            type: object
            title: SupportUploadToken
            properties:
              token:
                type: string
                description: The upload token that represents this upload request
    400:
      description: |
        Bad Request: the file is over the upload limit (`googleStore.maxUploadBytes`, 25 MB by
        default), or the server isn't configured for uploads
    422:
      description: |
        Unprocessable Entity: provided content is not processable
    500:
      description: Internal Server Error
