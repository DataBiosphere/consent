post:
  summary: Create a file upload for a support request
  operationId: supportUploadPost
  description: Create a file upload for a support request
  tags:
    - Support
  requestBody:
    content:
      application/binary:
        schema: {}
  responses:
    201:
      description: A token that represents the uploaded file
      content:
        application/json:
          schema:
            type: object
            title: SupportUploadToken
            properties:
              token:
                type: string
                description: The upload token that represents this upload request
    400:
      description: | 
        Bad Request: max file upload size is 5 MB or server not configured for uploads
    422:
      description: |
        Unprocessable Entity: provided content is not processable
    429:
      description: |
        Too many requests from this client IP; retry after `Retry-After` seconds. Support requests
        and uploads share one limit (`rateLimit.support.requestsPerMinute`, 30 a minute by default),
        which is for the whole deployment and split across Consent's pods.
      headers:
        Retry-After:
          schema:
            type: integer
    500:
      description: Internal Server Error
