get:
  summary: Get Study by Id
  operationId: apiDatasetStudyStudyIdGet
  description: Finds Study and Properties of the Study specified by id.
  parameters:
    - name: studyId
      in: path
      description: ID of the Study
      required: true
      schema:
        type: integer
  tags:
    - Study
  responses:
    200:
      description: The Study with properties
      content:
        application/json:
          schema:
            $ref: '../schemas/Study.yaml'
    404:
      description: Not Found
    429:
      description: Too Many Requests - rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
    500:
      description: Server error
put:
  summary: Update Study/Dataset Registration By Study Id
  operationId: apiDatasetStudyStudyIdPut
  description: |
    Updates the Study and its Datasets from a registration payload. Request
    validation is performed by backend DTO/domain validators. This OpenAPI
    document is the authoritative, forward-looking description of the
    request/response contract.
  tags:
    - Study
  parameters:
    - name: studyId
      in: path
      description: ID of the Study
      required: true
      schema:
        type: integer
  requestBody:
    description: |
      Registration payload and optional files for an alternative data sharing
      plan and institutional certification files. The registration payload is
      always required. If a file is also provided, then alternative data
      sharing information is required in the payload. Study Names can be
      updated, but they must be unique in the system.
      See [/api/dataset/studyNames](#/Study/findAllStudyNames) for a list of existing study names.
      Data Use fields can only be modified using Admin permissions. See
      [/api/dataset/{id}/datause](#/Admin/updateDatasetDataUse) to update a dataset's Data Use.
      Studies are updatable by Admins, Creators, and Data Custodians.

      The following fields cannot be changed on an existing Consent Group by this endpoint:
      * Data Submitter Name/Email (not part of the update payload)
      * All Data Use fields and Access Management (submitted values are silently ignored)
      * Consent Group Name (submitted renames are rejected with a 400)
      * Data Access Committee Id (submitted values are silently ignored)

      Additionally, existing Consent Groups cannot be removed from the study, but new ones can be
      added.
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            dataset:
              $ref: '../schemas/DatasetRegistrationSchemaV1.yaml'
            alternativeDataSharingPlan:
              description: Optional alternative data sharing plan
              type: string
              contentMediaType: application/octet-stream
            consentGroups[0].nihInstitutionalCertificationFile:
              description: Certification file for first consent group (others omitted because swagger does not allow variable number of file uploads)
              type: string
              contentMediaType: application/octet-stream
  responses:
    200:
      description: The Updated Study with properties
      content:
        application/json:
          schema:
            $ref: '../schemas/Study.yaml'
    400:
      description: Bad Request when schema is invalid or the required consent groups are not provided.
    401:
      description: Unauthorized.
    403:
      description: Forbidden
    404:
      description: Not Found
    429:
      description: Too Many Requests - rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
    500:
      description: Server error
delete:
  summary: Delete Study
  operationId: apiDatasetStudyStudyIdDelete
  description: |
    Deletes Study, Datasets, and all properties of the Study specified by id.
    * Admins can delete any study
    * Chairpersons and Data Submitters can delete studies they created
  parameters:
    - name: studyId
      in: path
      description: Study ID
      required: true
      schema:
        type: integer
  tags:
    - Study
  responses:
    200:
      description: The Study was successfully deleted
    400:
      description: Study is in use and cannot be deleted
    401:
      description: Unauthorized.
    404:
      description: Not Found
    429:
      description: Too Many Requests - rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
    500:
      description: Server error
patch:
  summary: Patch Study
  operationId: apiDatasetStudyStudyIdPatch
  description: |
    This API allows Admins, Chairpersons, and Data Submitters to patch a limited set of study
    properties. All fields are optional and if not provided, will be ignored.
      * Study name
      * Study type
      * Study description
      * Study datatypes (list of strings)
      * Study Phenotype/Indication
      * Study Species
      * Study Target Delivery Date
      * Study Target Public Release Date
      * Study PI Name
      * Study public visibility (boolean)
  parameters:
    - name: studyId
      in: path
      description: ID of the Study
      required: true
      schema:
        type: integer
  tags:
    - Study
  requestBody:
    description: StudyPatch object
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/StudyPatch.yaml'
  responses:
    200:
      description: Study Patch applied successfully
      content:
        application/json:
          schema:
            $ref: '../schemas/Study.yaml'
    304:
      description: Not Modified
    404:
      description: Not Found
    429:
      description: Too Many Requests - rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
    500:
      description: Server error.
