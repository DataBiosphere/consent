post:
  summary: Allows a SIGNING OFFICIAL to approve a collection by collection ID
  operationId: apiCollectionsCollectionIdApprovePost
  description: Returns an approved DAR collection
  tags:
    - DAR Collection
    - Election
  parameters:
    - name: collectionId
      in: path
      description: DAR Collection Id
      required: true
      schema:
        type: integer
  requestBody:
    description: >-
      The submission the signing official reviewed, with its referenceId and submissionDate.
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/SubmissionApproval.yaml'
  responses:
    200:
      description: Returns target dar collection
      content:
        application/json:
          schema:
            $ref: '../schemas/DarCollection.yaml'
    400:
      description: >-
        Bad Request. Check error details. A request that doesn't name the submission with both its
        referenceId and submissionDate (including no body or {}) is rejected.
    401:
      description: Not authorized to perform this action.
    404:
      description: Not Found
    409:
      description: >-
        Conflict. The collection does not require approval, has a submitted closeout, or holds a
        draft, the DAR is canceled, the DAR's submission date changed while the request waited
        for the collection lock, or the collection's latest submission isn't the one the body
        names.
    429:
      description: Too Many Requests - rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
    500:
      description: Internal Server Error
