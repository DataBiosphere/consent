get:
  description: |
    Lists the datasets whose persisted Data Use shape the canonical validator would reject: no
    primary under controlled, external, or missing access management; a primary under open access;
    or more than one primary.
    Identifies each dataset so an admin can correct it. Carries classification labels only, never
    the stored Data Use or its Other free text.
  tags:
    - Dataset
    - Admin
  responses:
    200:
      description: Returns the noncanonical datasets, or an empty array when none remain.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../schemas/NoncanonicalDataUseView.yaml'
    401:
      description: Unauthorized - The requester is not authenticated.
    403:
      description: Forbidden - Admin use only.
    429:
      description: Too Many Requests - rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
    500:
      description: Internal Server Error - An error occurred while processing the request.

  operationId: apiDatauseLegacyNoncanonicalGet
