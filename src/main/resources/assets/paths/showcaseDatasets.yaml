post:
  summary: Look up Data Showcase datasets
  operationId: showcaseDatasetsPost
  description: |
    Anonymous, read-only lookup of public Data Showcase dataset summaries. The route is outside
    `/api` and needs no authentication. Each client IP is rate limited (429 with `Retry-After`).
    Every response has `Cache-Control: no-store`.

    The `identifiers` mode resolves an editorial list of canonical `DUOS-` identifiers in one
    query. The result has one entry for each unique identifier, in the order first submitted:
    a summary when the dataset is eligible for the section, otherwise an `unavailable` result.
    Nonexistent, private, deleted and section-ineligible datasets get the same `unavailable`
    result. The `open-access-datasets` section admits open-access datasets only.

    Hard limits (contract values, also enforced by the BFF proxy and the duos-ui guard):
      * Request body: at most 65536 bytes (64 KiB), else 413 before the body is parsed.
      * `identifiers`: at most 200 entries, counted before duplicates are removed.
      * Each identifier: at most 32 characters, in canonical form (`DUOS-000123`, not `DUOS-123`).
      * Unknown modes, unknown sections, duplicate fields and fields that do not belong to the
        mode get a 400 before any data is read.

    The `ranking`, `all` and `stats` modes are not available yet.
  security: []
  tags:
    - Data Showcase
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../schemas/ShowcaseIdentifiersLookupRequest.yaml'
        example:
          mode: identifiers
          section: open-access-datasets
          identifiers:
            - DUOS-000123
            - DUOS-000999
  responses:
    200:
      description: One result for each unique identifier, in the order first submitted
      headers:
        Cache-Control:
          schema:
            type: string
            example: no-store
      content:
        application/json:
          schema:
            $ref: '../schemas/ShowcaseLookupResponse.yaml'
    400:
      description: The request breaks the lookup contract
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
          example:
            message: Identifier "DUOS-123" is not canonical; use "DUOS-000123"
            code: 400
    413:
      description: The request body is larger than 65536 bytes
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
    415:
      description: The request body is not `application/json`
    429:
      description: Too many requests from this client IP; retry after `Retry-After` seconds
      headers:
        Retry-After:
          schema:
            type: integer
    500:
      description: Internal Server Error, with a fixed message
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
