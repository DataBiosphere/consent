post:
  summary: Look up Data Showcase datasets
  operationId: showcaseDatasetsPost
  description: |
    Anonymous, read-only lookup of public Data Showcase dataset summaries. The route is outside
    `/api` and needs no authentication. Each client IP is rate limited (429 with `Retry-After`).
    The route exists only in a deployment that sets `showcase.publicLookupEnabled: true`; it is
    off by default, and the path is then a 404.
    Every response from the lookup itself (200, 400, 413 and 500) has `Cache-Control: no-store`.
    A 404, 415 or 429 that the server builds before the lookup runs does not, and none of them
    carries dataset data.

    Modes:
      * `identifiers`: resolves an editorial list of canonical `DUOS-` identifiers in one query.
        The result has one entry for each unique identifier, in the order first submitted: a
        summary when the dataset is eligible for the section, otherwise an `unavailable`
        result. Nonexistent, private, deleted and section-ineligible datasets get the same
        `unavailable` result.
      * `ranking`: a computed shelf (`newest`), with optional `scope`, `limit`, `pin` and
        `exclude`. Hidden datasets never appear in or affect a ranking.
      * `all`: one page of every public-eligible dataset in identifier order, with a
        `nextCursor` for the next page (null on the last page).
      * `stats`: `studyCount` and `datasetCount` for the catalog-eligible datasets in the
        optional `scope`, or in the whole catalog without one. Section rules do not apply, and
        hidden datasets leave the counts unchanged.

    The `open-access-datasets` section admits open-access datasets only.

    Hard limits (contract values, also enforced by the BFF proxy and the duos-ui guard):
      * Request body: at most 65536 bytes (64 KiB), else 413 before the body is parsed.
      * `identifiers` and `exclude`: at most 200 entries; `pin`: at most 50. Entries are
        counted before duplicates are removed.
      * `scope.dac`: at most 20 values, each 1 to 255 characters. `limit`: 1 to 50 (default 12).
        `pageSize`: 1 to 200 (default 100). `cursor`: at most 512 characters.
      * Each identifier: at most 32 characters, in canonical form (`DUOS-000123`, not `DUOS-123`),
        with a number no larger than 2147483647.
      * Unknown modes, unknown sections, duplicate fields and fields that do not belong to the
        mode get a 400 before any data is read. JSON nested deeper than a scope value list gets
        a 400.

  security: []
  tags:
    - Data Showcase
  requestBody:
    required: true
    content:
      application/json:
        schema:
          oneOf:
            - $ref: '../schemas/ShowcaseIdentifiersLookupRequest.yaml'
            - $ref: '../schemas/ShowcaseRankingLookupRequest.yaml'
            - $ref: '../schemas/ShowcaseAllLookupRequest.yaml'
            - $ref: '../schemas/ShowcaseStatsLookupRequest.yaml'
        examples:
          identifiers:
            summary: An editorial list
            value:
              mode: identifiers
              section: open-access-datasets
              identifiers:
                - DUOS-000123
                - DUOS-000999
          ranking:
            summary: A computed shelf with a scope, a pin and an exclusion
            value:
              mode: ranking
              section: latest-data-releases
              ranking: newest
              scope:
                dac:
                  - Example DAC
              limit: 12
              pin:
                - DUOS-000789
              exclude:
                - DUOS-000111
  responses:
    200:
      description: >
        `identifiers` and `ranking`: a `datasets` list. `all`: a `datasets` page and
        `nextCursor`. `stats`: `studyCount` and `datasetCount`.
      headers:
        Cache-Control:
          schema:
            type: string
            example: no-store
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '../schemas/ShowcaseLookupResponse.yaml'
              - $ref: '../schemas/ShowcasePageResponse.yaml'
              - $ref: '../schemas/ShowcaseStatsResponse.yaml'
    400:
      description: The request breaks the lookup contract
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
          example:
            message: Identifier "DUOS-123" is not canonical; use "DUOS-000123"
            code: 400
    413:
      description: The request body is larger than 65536 bytes
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
    415:
      description: The request body is not `application/json`
    429:
      description: Too many requests from this client IP; retry after `Retry-After` seconds
      headers:
        Retry-After:
          schema:
            type: integer
    500:
      description: Internal Server Error, with a fixed message
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
