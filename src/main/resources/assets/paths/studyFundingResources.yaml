get:
  summary: Registered funding resources for a study
  operationId: apiStudyAssetsFundingResourcesGet
  parameters:
    - name: studyId
      in: path
      required: true
      schema: { type: integer }
  tags: [Study]
  responses:
    200:
      description: Study funding resources
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '../schemas/FundingResource.yaml' }
    404: { description: Study not found, or not visible to this user }
