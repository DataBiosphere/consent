get:
  summary: Registered models for a study
  operationId: apiStudyAssetsModelsGet
  parameters:
    - name: studyId
      in: path
      required: true
      schema: { type: integer }
  tags: [Study]
  responses:
    200:
      description: Study models
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '../schemas/AiModel.yaml' }
    404: { description: Study not found, or not visible to this user }
