post:
  summary: Index Ontology
  description: Index Ontology
  operationId: indexOntology
  parameters:
    - name: ontologyType
      in: query
      description: | 
        The type of the ontology file to index. Note that the ontology file
        specified must exist in the configured ontology file storage location.
      required: true
      schema:
        type: string
        enum: [ DOID, DUO ]
  tags:
    - Admin
  responses:
    200:
      description: Ontology Query Results
    500:
      description: Internal Server Error