post:
  summary: Index Ontology
  description: Index Ontology
  operationId: indexOntology
  parameters:
    - name: fileName
      in: query
      description: The name of the ontology file to index.
      required: true
      schema:
        type: string
    - name: fileType
      in: query
      description: The type of the ontology file to index
      required: true
      schema:
        type: string
        enum: [ DOID, DUOS, DUO ]
  tags:
    - Admin
    - Ontology
  responses:
    200:
      description: Ontology Query Results
    500:
      description: Internal Server Error