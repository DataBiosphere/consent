get:
  summary: DAC decision turnaround per DAR
  operationId: apiMetricsDarDecisionTurnaroundGet
  description: |
    Admin only. Days from submission to the last DAC decision, per decided original DAR submitted in the range, rolled up as in dar-decisions. A DAR with a deciding vote cast before March 2021, which has no vote date, or decided before its recorded submission date, is counted in unmeasured rather than measured. Mode is over whole days, the smallest on a tie.
  parameters:
    - name: from
      in: query
      required: true
      description: First submission date to include, as yyyy-MM-dd, from 1900 to 9999.
      schema:
        type: string
        format: date
    - name: to
      in: query
      required: true
      description: Last submission date to include, as yyyy-MM-dd, from 1900 to 9999. Not before from.
      schema:
        type: string
        format: date
    - name: bucket
      in: query
      required: false
      description: Submission-date bucket for the counts.
      schema:
        type: string
        enum: [day, week, month, quarter]
        default: quarter
    - name: limit
      in: query
      required: false
      description: Rows per page, 1 to 1000.
      schema:
        type: integer
        default: 100
    - name: offset
      in: query
      required: false
      description: Rows to skip.
      schema:
        type: integer
        default: 0
  tags:
    - Metrics
    - Admin
  responses:
    200:
      description: Turnaround per bucket and one page of measured rows.
      content:
        application/json:
          schema:
            $ref: '../schemas/DarTurnaroundReport.yaml'
    400:
      description: Missing or invalid query parameter.
    401:
      description: Unauthorized.
    403:
      description: Admin only.
    429:
      description: Too Many Requests - rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
    500:
      description: Internal Server Error
