get:
  summary: Get DAC automation rules by ID
  operationId: apiDacDacIdRulesGet
  description: View the rules available and their state
  parameters:
    - name: dacId
      in: path
      description: The DAC Id
      required: true
      schema:
        type: integer
  tags:
    - DAC
  responses:
    200:
      description: The Data Access Committee automatic processing rules matching the provided ID
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../schemas/DacAutomationRule.yaml'
    403:
      description: The user is not authorized to retrieve these settings
    401:
      description: No DAC found with the given ID
    429:
      description: Too Many Requests - rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
    500:
      description: Internal Server Error
