put:
  summary: Resync a Study's Asset Records
  operationId: apiDatasetStudyStudyIdAssetsRecordsPut
  description: Rebuilds the study's model, workspace and biospecimen records from its stored registration, in one transaction, then reindexes the study's datasets that are already in the search index. A failed reindex keeps the sync and reports index FAILED.
  tags:
    - Admin
  parameters:
    - name: studyId
      in: path
      description: ID of the Study
      required: true
      schema:
        type: integer
  responses:
    200:
      description: The study's resync result
      content:
        application/json:
          schema:
            $ref: '../schemas/StudyAssetSync.yaml'
    400:
      description: A biospecimen's biospecimenId is in server-id form but matches none of the study's biospecimens, and it has no sampleId; move its sample id into sampleId and retry.
    401:
      description: Unauthorized.
    403:
      description: User is not an Admin
    404:
      description: Study not found
    429:
      description: Too Many Requests - rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
    500:
      description: Server error
