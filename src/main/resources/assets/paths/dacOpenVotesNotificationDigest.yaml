get:
  summary: Send Open Vote Notifications to DAC chairs and members
  description: Sends a message in digest form to DAC chairs and members with open elections where the member hasn't voted indicating they have elections to respond to.
  tags:
    - Notifier
  responses:
    200:
      description: Notification process started.
    401:
      description: Not authenticated.
    403:
      description: Not authorized.
    500:
      description: Server error
