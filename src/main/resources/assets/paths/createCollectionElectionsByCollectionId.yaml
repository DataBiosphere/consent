post:
  summary: Create Elections for Collection By ID
  operationId: apiCollectionsCollectionIdElectionPost
  description: Returns created Elections for Dars in Collection
  tags:
    - DAR Collection
    - Election
  parameters:
    - name: collectionId
      in: path
      description: DAR Collection Id
      required: true
      schema:
        type: integer
  responses:
    200:
      description: Returns target dar collection
      content:
        application/json:
          schema:
            $ref: '../schemas/DarCollection.yaml'
    400:
      description: Bad Request.  Check error details
    401:
      description: Not authorized to perform this action.
    404:
      description: Not Found
    409:
      description: Conflict.  Check error details
    429:
      description: Too Many Requests - rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
    500:
      description: Internal Server Error
