get:
  summary: Get a specific file attachment associated with a draft
  operationId: apiDraftV1DraftUUIDAttachmentsFileIdGet
  description: Provides the an individual file attachment connected to a draft.
  tags:
    - Draft
  parameters:
    - name: draftUUID
      in: path
      description: The UUID identifying the draft. See https://en.wikipedia.org/wiki/Universally_unique_identifier#Version_4_(random)
      required: true
      schema:
        type: string
        format: uuid
    - name: fileId
      in: path
      description: The integer identifying the attachment.
      required: true
      schema:
        type: integer
  responses:
    200:
      description: File contents.
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    401:
      description: User not authorized to get file attachment
    404:
      description: The draft and/or the attachment cannot be found.
    500:
       description: An unrecoverable error occurred when attempting to return this attachment.
delete:
  summary: Get the list of attachments associated with a draft
  operationId: apiDraftV1DraftUUIDAttachmentsFileIdDelete
  description: Provides the list of attachments that are part of a draft.
  tags:
    - Draft
  parameters:
    - name: draftUUID
      in: path
      description: The UUID identifying the draft.  See https://en.wikipedia.org/wiki/Universally_unique_identifier#Version_4_(random)
      required: true
      schema:
        type: string
        format: uuid
    - name: fileId
      in: path
      description: The integer identifying the attachment.
      required: true
      schema:
        type: integer
  responses:
    200:
      description: Successful delete.
    401:
      description: User not authorized to delete file attachment
    404:
      description: The draft and/or the attachment cannot be found.
    500:
      description: An unrecoverable error occurred when deleting this attachment.
