post:
  summary: Alert appropriate Signing Officials & Researchers of a new DAA Upload for the provided DAC
  operationId: apiDaaDacIdUpdatedOldDaaIdNewDaaNamePost
  description: Email Signing Officials & Researchers that a new DAA was uploaded
  parameters:
    - name: dacId
      in: path
      description: The DAC ID
      required: true
      schema:
        type: integer
    - name: oldDaaId
      in: path
      description: The previous DAA ID
      required: true
      schema:
        type: integer
    - name: newDaaName
      in: path
      description: The name of the newly uploaded DAA
      required: true
      schema:
        type: string
  tags:
    - DAA
    - Mail
  responses:
    200:
      description: Emails were sent to Signing Officials and Researchers about the newly uploaded DAA. `failed` counts recipients whose email could not be sent; the others already received theirs, so retrying would email them again.
      content:
        application/json:
          schema:
            type: object
            properties:
              sent:
                type: integer
                description: Number of emails sent
              skipped:
                type: integer
                description: Number of recipients not emailed because they opted out of email or notifications are off
              failed:
                type: integer
                description: Number of emails that could not be sent
    404:
      description: DAC, DAA, or User Not Found
    429:
      description: Too Many Requests - rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
    500:
      description: Internal Server Error, including when the DAA has no file or no email could be sent
