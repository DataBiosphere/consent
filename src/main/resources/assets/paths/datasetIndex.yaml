post:
  summary: Index all datasets
  operationId: apiDatasetIndexPost
  description: Index all datasets in the system
  tags:
    - Admin
    - Dataset
  responses:
    200:
      description: All datasets have been indexed
    404:
      description: No datasets found to index
    429:
      description: Too Many Requests - rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
