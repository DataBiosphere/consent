get:
  summary: Download document file by entity and file id
  operationId: apiDocumentEntityEntityIdIdFileGet
  description: Streams a document file directly from storage for the specified entity and file id.
  parameters:
    - name: entity
      in: path
      required: true
      description: Entity type
      schema:
        type: string
        enum: [dac, dar, dataset, study]
    - name: entityId
      in: path
      required: true
      description: Entity identifier
      schema:
        type: string
    - name: id
      in: path
      required: true
      description: FileStorageObject id
      schema:
        type: integer
  tags:
    - Document
  responses:
    200:
      description: File stream
      headers:
        Content-Type:
          description: Media type of the file
          schema:
            type: string
        Content-Disposition:
          description: Attachment filename
          schema:
            type: string
      content:
        application/octet-stream:
          schema: {}
    401:
      description: Unauthorized
    403:
      description: Forbidden
    404:
      description: Not Found
    502:
      description: Bad Gateway

