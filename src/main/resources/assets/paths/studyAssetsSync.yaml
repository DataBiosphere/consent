post:
  summary: Resync the Asset Records of Many Studies
  operationId: apiDatasetStudyAssetsSyncPost
  description: Resyncs each study as the single-study call does, one transaction per study in study id order. A failed study is reported and the run continues. Streams one StudyAssetSync per line, then a summary line; while studies remain, call again with afterStudyId set to its nextAfterStudyId.
  tags:
    - Admin
  parameters:
    - name: since
      in: query
      description: ISO-8601 instant, such as 2026-10-30T18:00:00Z. Resyncs only studies created or updated at or after it; omit to resync every study. Every write that changes a study's assets sets its update date.
      required: false
      schema:
        type: string
        format: date-time
    - name: afterStudyId
      in: query
      description: Resync only studies with a greater id.
      required: false
      schema:
        type: integer
        default: 0
    - name: limit
      in: query
      description: The most studies to resync in this call.
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 500
  responses:
    200:
      description: Newline-delimited JSON, streamed as each study finishes
      content:
        application/x-ndjson:
          schema:
            oneOf:
              - $ref: '../schemas/StudyAssetSync.yaml'
              - $ref: '../schemas/StudyAssetSyncSummary.yaml'
    400:
      description: since is not an ISO-8601 instant, or limit is out of range
    401:
      description: Unauthorized.
    403:
      description: User is not an Admin
    429:
      description: Too Many Requests - rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
    500:
      description: The studies to resync could not be listed; nothing was synced
