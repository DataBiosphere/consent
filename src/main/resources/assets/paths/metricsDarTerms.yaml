get:
  summary: Ontology terms most cited by DARs
  operationId: apiMetricsDarTermsGet
  description: |
    Admin only. The ontology terms cited by the most DAR submissions in the range, most first,
    from each DAR's research use statement. Progress reports, and canceled and archived DARs,
    aren't counted, and a submission counts once per term however often it cites it, including
    one saved before 2022-07-27 as one DAR per dataset.
  parameters:
    - name: from
      in: query
      required: true
      description: First submission date to include, as yyyy-MM-dd, from 1900 to 9999.
      schema:
        type: string
        format: date
    - name: to
      in: query
      required: true
      description: Last submission date to include, as yyyy-MM-dd, from 1900 to 9999. Not before from.
      schema:
        type: string
        format: date
    - name: limit
      in: query
      required: false
      description: How many terms to return, from 1 to 1000.
      schema:
        type: integer
        default: 10
  tags:
    - Metrics
    - Admin
  responses:
    200:
      description: The top terms.
      content:
        application/json:
          schema:
            $ref: '../schemas/TermReport.yaml'
    400:
      description: Missing or invalid query parameter.
    401:
      description: Unauthorized.
    403:
      description: Admin only.
    429:
      description: Too Many Requests - rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
    500:
      description: Internal Server Error
