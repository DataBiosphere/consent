post:
  deprecated: true
  operationId: apiDarV2ProgressReportParentReferenceIdPost
  summary: |
    Create a new DAR progress report
    See /api/dar/v3/progress_report/{parentReferenceId} for replacement
  description: |
    Create a new DAR progress report
    A closeout automatically includes every dataset in the collection, ignoring the supplied
    dataset selection, even if dataset registration approval has since changed. Dataset-dependent
    collaboration and ethics documents are not required for closeouts. Submission
    immediately terminates all grants enabled by the collection
    and prevents further DAC voting, election creation, or cancellation.
    Deprecated in favor of /api/dar/v3/progress_report/{parentReferenceId}
  tags:
    - Data Access Request
  parameters:
    - name: parentReferenceId
      in: path
      description: The referenceId of the Data Access Request
      required: true
      schema:
        type: string
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            dar:
              type: object
              description: An object that follows the Data Access Request schema
            collaboratorRequiredFile:
              type: string
              contentMediaType: application/octet-stream
            ethicsApprovalRequiredFile:
              type: string
              contentMediaType: application/octet-stream
  responses:
    200:
      description: Returns the Data Access Request with progress report
      content:
        application/json:
          schema:
            $ref: '../schemas/DataAccessRequest.yaml'
    400:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
    401:
      description: Unauthorized.
    403:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
    404:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
    429:
      description: Too Many Requests - rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
    500:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '../schemas/ErrorResponse.yaml'
