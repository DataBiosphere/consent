get:
  summary: Get document metadata by entity
  operationId: findDocumentsByEntity
  description: Returns metadata for all non-deleted file storage objects associated with the given entity and entity id.
  tags:
    - Document
  parameters:
    - name: entity
      in: path
      description: Entity type. Supported values are dataset and study.
      required: true
      schema:
        type: string
    - name: entityId
      in: path
      description: Entity identifier.
      required: true
      schema:
        type: string
  responses:
    200:
      description: Returns file metadata records. Empty list is returned when there are no documents.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../schemas/FileStorageObject.yaml'
    401:
      description: Unauthorized. Authentication is required and has failed or has not yet been provided.
    403:
      description: User does not have read access to this entity.
    404:
      description: Entity was not found.