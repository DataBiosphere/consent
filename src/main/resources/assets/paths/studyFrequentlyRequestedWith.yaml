get:
  summary: Publicly visible studies frequently requested alongside a study
  operationId: apiMetricsStudyRecommendationsFrequentlyRequestedWithGet
  parameters:
    - name: studyId
      in: path
      required: true
      schema: { type: integer }
  tags: [Metrics]
  responses:
    200:
      description: Up to 12 studies, most frequently co-requested first
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '../schemas/StudyRecommendation.yaml' }
    404: { description: Study not found, or not visible to this user }
