server:
  type: simple
  applicationContextPath: /
  adminContextPath: /admin
  connector:
    type: http
    port: 8180
  requestLog:
    appenders:
      - type: console
        layout:
          type: access-json
database:
  driverClass: org.postgresql.Driver
  user: consent
  password: consent
  url: jdbc:postgresql://sqlproxy:5432/consent
  initialSize: 20
  minSize: 20
  maxSize: 128
  validationQuery: SELECT 1
googleStore:
  password: password
  bucket: bucket
  endpoint: endpoint
# Logging settings
logging:
  # default logging level
  level: WARN
  appenders:
    - type: console
      threshold: INFO
      target: stdout
      layout:
        type: json
  # logger specific levels
  loggers:
    "org.broadinstitute.consent.http.cloudstore.GCSService": OFF
services:
  localURL: http://localhost:8000/#/
  samUrl: https://localhost:8181/
  ecmUrl: http://localhost:8182/
mailConfiguration:
  activateEmailNotifications: false
  googleAccount: test@gmail.com
  sendGridApiKey: test-key
  sendGridStatusUrl: test-sg-status
  sendGridUnsubscribeGroupId: null
freeMarkerConfiguration:
  templateDirectory: /freemarker
  defaultEncoding: UTF-8
elasticSearch:
  servers:
    - localhost
  indexName: iName
  datasetIndexName: dataset
oidcConfiguration:
  clientId: clientId
  addClientIdToScope: true
  extraAuthParams: prompt=login
  authorityEndpoint: http://localhost:8000
rateLimit:
  enabled: true
  requestsPerMinute: 100
  podCount: 1
# Optional. If you omit this block, runOnStartup is false and the application does not run the
# Liquibase changesets at startup. Environments that run the separate Liquibase migration Job omit
# it. Local databases are often restored from an older dump, so run them at startup.
liquibase:
  runOnStartup: true

# Optional. If you omit this block, the anonymous showcase lookup is off. See ShowcaseConfiguration.
showcase:
  publicLookupEnabled: true
