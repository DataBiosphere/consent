#Properties
#
# This file shadows the mvn.properties that properties-maven-plugin generates into
# target/test-classes, because test resources are copied after generate-resources. The deployed jar
# gets the plugin's full property set; tests get only what is listed here, so a property read at
# runtime has to be added in both places.
swagger.ui.path=${swagger.ui.path}
elasticsearch.rest.client.version=${elasticsearch.rest.client.version}
