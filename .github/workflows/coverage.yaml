# Note that the sonar token used for this action is maintained in Google Secrets Manager by Devops
name: Coverage
on:
  push:
    branches:
    - develop
  pull_request:
    branches:
    - develop
jobs:
  package:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'maven'
      - name: Validate Maven wrapper
        uses: apache/maven-wrapper-validator-action@3c8d527e913656f7e1891295dd6ba0a58f535102 # v3.3.2
      - name: Test Only
        env:
          MAVEN_OPTS: -Dorg.slf4j.simpleLogger.defaultLogLevel=warn -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -Dmaven.wagon.httpconnectionManager.ttlSeconds=120
        run: ./mvnw clean jacoco:prepare-agent test jacoco:report --batch-mode
      - name: Test Report
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          MAVEN_OPTS: -Dorg.slf4j.simpleLogger.defaultLogLevel=warn -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -Dmaven.wagon.httpconnectionManager.ttlSeconds=120
        run: |
          ./mvnw -v
          ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:sonar --batch-mode
