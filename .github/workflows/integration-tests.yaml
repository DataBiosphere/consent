name: Integration Tests

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      sql-file:
        description: >-
          Path (relative to repo root) to a SQL dump file used to seed the
          database.  Overrides the DB_SEED_SQL_FILE repository variable when
          Leave blank to use .github/config/seed-ci.sql (the default
          synthetic seed), or set DB_SEED_SQL_FILE at the repo level to
          override it persistently without changing the workflow file.
        required: false
        default: ""

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: consent
          POSTGRES_USER: consent
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U consent -d consent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      elasticsearch:
        image: elasticsearch:9.3.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          cluster.routing.allocation.disk.threshold_enabled: "false"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=30s"
          --health-interval 30s
          --health-timeout 15s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build application jar
        run: |
          mvn clean package -Dmaven.test.skip=true --batch-mode --no-transfer-progress

      # Resolve which SQL file to seed the database with.
      # Priority (highest → lowest):
      #   1. workflow_dispatch input  (sql-file)
      #   2. DB_SEED_SQL_FILE repository/environment variable
      #   3. .github/config/seed-ci.sql – the default synthetic seed file
      #   4. Skip seeding            – Liquibase initialises a clean schema only.
      - name: Resolve SQL seed file
        id: resolve-sql
        env:
          DISPATCH_FILE: ${{ inputs.sql-file }}
          REPO_SQL_FILE: ${{ vars.DB_SEED_SQL_FILE }}
        run: |
          if [[ -n "$DISPATCH_FILE" && -f "$DISPATCH_FILE" ]]; then
            echo "sql-file=$DISPATCH_FILE" >> "$GITHUB_OUTPUT"
          elif [[ -n "$REPO_SQL_FILE" && -f "$REPO_SQL_FILE" ]]; then
            echo "sql-file=$REPO_SQL_FILE" >> "$GITHUB_OUTPUT"
          elif [[ -f ".github/config/seed-ci.sql" ]]; then
            echo "sql-file=.github/config/seed-ci.sql" >> "$GITHUB_OUTPUT"
          else
            echo "sql-file=" >> "$GITHUB_OUTPUT"
            echo "No SQL seed file found; Liquibase will initialise a clean schema."
          fi

      - name: Seed database
        if: steps.resolve-sql.outputs.sql-file != ''
        env:
          PGPASSWORD: ci-password
        run: |
          psql -h localhost -U consent -d consent \
            -f "${{ steps.resolve-sql.outputs.sql-file }}"

      # Write a stub GCS service-account JSON so the app can start without
      # real credentials.  All GCS operations will fail at runtime, which is
      # acceptable for integration tests that only exercise HTTP/DB paths.
      - name: Write stub GCS service-account
        run: |
          cat > /tmp/ci-gcs-account.json <<'SACEOF'
          {
            "type": "service_account",
            "project_id": "ci-project",
            "private_key_id": "ci-key-id",
            "private_key": "",
            "client_email": "ci@ci-project.iam.gserviceaccount.com",
            "client_id": "000000000000000000000",
            "auth_uri": "https://accounts.google.com/o/oauth2/auth",
            "token_uri": "https://oauth2.googleapis.com/token"
          }
          SACEOF

      - name: Start application
        run: |
          java \
            -classpath "target/classes:$(find target/lib -name '*.jar' | tr '\n' ':')" \
            org.broadinstitute.consent.http.ConsentApplication \
            server .github/config/consent-ci.yaml \
            > /tmp/consent-app.log 2>&1 &
          echo "APP_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for application to be healthy
        timeout-minutes: 3
        run: |
          echo "Waiting for consent app on port 8080..."
          for i in $(seq 1 36); do
            if curl -sf http://localhost:8080/status > /dev/null 2>&1; then
              echo "Application is up after ~$((i * 5)) seconds."
              exit 0
            fi
            echo "  Attempt $i/36 – not ready yet, sleeping 5s..."
            sleep 5
          done
          echo "Application failed to start within 3 minutes."
          echo "=== app log ==="
          cat /tmp/consent-app.log
          exit 1

      - name: Run integration tests
        run: |
          mvn test -P integration-tests \
            -DbaseUrl="http://localhost:8080/" \
            --batch-mode

      - name: Stop application
        if: always()
        run: |
          if [[ -n "$APP_PID" ]]; then
            kill "$APP_PID" || true
          fi

      - name: Upload application log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-log
          path: /tmp/consent-app.log

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: target/surefire-reports
  report-workflow:
    if: github.ref == 'refs/heads/develop'
    uses: broadinstitute/sherlock/.github/workflows/client-report-workflow.yaml@26b6fc02e7a5bab765d9237d677d184f413fbc85
    with:
      relates-to-chart-releases: 'consent-dev'
      notify-slack-channels-upon-workflow-failure: ${{ vars.SLACK_NOTIFICATION_CHANNELS }}
      notify-slack-channels-upon-workflow-retry: ${{ vars.SLACK_NOTIFICATION_CHANNELS }}
    permissions:
      id-token: write
