name: Maven
on: [pull_request]
jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'maven'
      - name: Validate Maven wrapper download
        env:
          MAVEN_USER_HOME: ${{ runner.temp }}/maven-wrapper-validation
        run: ./mvnw -v --batch-mode
      - name: Spotless Check
        run: ./mvnw -q spotless:check --batch-mode
      - name: Package
        env:
          MAVEN_OPTS: -Dorg.slf4j.simpleLogger.defaultLogLevel=warn -Dmaven.test.skip=true -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -Dmaven.wagon.httpconnectionManager.ttlSeconds=120
        run: |
          ./mvnw -v
          ./mvnw clean package --batch-mode
