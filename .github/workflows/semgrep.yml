name: Semgrep
on: [ pull_request ]
jobs:
  semgrep:
    if: false # disabled until spotless changes are merged
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    name: Check
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: semgrep ci --config=p/findsecbugs
